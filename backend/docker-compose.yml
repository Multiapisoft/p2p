services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 9091
    expose:
      - "9091"
    networks:
      - p2p
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:9091/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: p2p-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - p2p

networks:
  p2p:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
