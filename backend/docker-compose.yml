services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 9091
    expose:
      - "9091"
    networks:
      - p2p
      - shared-db
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:9091/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Traffic is terminated by host edge-caddy (dev.payment.fairplayoffical.com → p2p-backend:9091).
  # Do not publish :80/:443 here — those ports belong to edge-caddy.

networks:
  p2p:
    driver: bridge
  shared-db:
    external: true
    name: shared-db
  edge:
    external: true
    name: edge
